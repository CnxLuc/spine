# The unit tests on Linux, a Mac and Windows: the bash connector against GNU
# and BSD tools, and the Windows connector built with Windows' own compiler.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node build.mjs
      - if: runner.os != 'Windows'
        run: node --test test/*.test.mjs
      - if: runner.os == 'Windows'
        run: node --test test/windows.test.mjs test/notes.test.mjs test/text.test.mjs test/pricing.test.mjs
